<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMU Academy · SME AI Readiness Self-Assessment | 新加坡管理大学中小企业人工智能准备度自评</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141C52;
    --navy-live:#141B4D;
    --navy-deep:#0B0F2C;
    --muted-blue:#444977;
    --gold:#8A704C;
    --gold-dark:#6E5A3D;
    --gold-hover:#755F41;
    --gold-light:#D0C6B7;
    --gold-pale:#E8E2DA;
    --surface:#FFFFFF;
    --surface-subtle:#F9F7F3;
    --surface-muted:#F8F9FA;
    --border:#DEE2E6;
    --text:#000000;
    --text-secondary:#212529;
    --grey:#6C757D;
    --green:#2E9E5B;
    --lgreen:#7DBB4F;
    --yellow:#E8B800;
    --orange:#E67E22;
    --red:#D64545;
    --goldbg:#E8E2DA;
    --cta:#141C52;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Libre Franklin','Microsoft YaHei','PingFang SC',Arial,sans-serif;
    color:var(--text);
    background:var(--surface-subtle);
    line-height:1.5;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px 64px}
  header.top{
    background:var(--navy);
    border-bottom:4px solid var(--gold);
    padding:0;
  }
  header.top .wrap{
    min-height:100px;
    display:flex;
    justify-content:space-between;
    align-items:stretch;
    gap:24px;
    flex-wrap:wrap;
    padding-bottom:0;
  }
  .brand{display:flex;align-items:stretch;gap:28px;min-width:0}
  .logobox{
    background:#fff;
    min-height:100px;
    padding:16px 48px 16px 24px;
    display:flex;
    align-items:center;
    flex:0 0 auto;
    clip-path:polygon(0 0,100% 0,calc(100% - 48px) 100%,0 100%);
  }
  .logobox img{display:block;max-height:72px;width:auto}
  .brandtext{display:flex;flex-direction:column;justify-content:center;padding:14px 0;min-width:0}
  .brandtext h1{
    font-family:'Oswald',Arial,sans-serif;
    font-size:30px;
    font-weight:400;
    color:#fff;
    line-height:1.2;
    letter-spacing:.01em;
  }
  .brandtext p{color:var(--gold-pale);font-size:13px;margin-top:6px}
  .langtoggle{
    align-self:center;
    display:flex;
    border:1px solid var(--gold-light);
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,.08);
  }
  .langtoggle button{
    background:transparent;
    color:#fff;
    border:none;
    padding:8px 18px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    font-family:'Libre Franklin',Arial,sans-serif;
  }
  .langtoggle button.active{background:#fff;color:var(--navy)}
  h1,h2,h3,h4{
    font-family:'Oswald','Libre Franklin',Arial,sans-serif;
    font-weight:400;
    color:var(--navy);
    line-height:1.25;
  }
  h2{font-size:32px;margin-bottom:12px}
  .hero{
    background:var(--navy);
    position:relative;
    overflow:hidden;
    background-position:center;
    background-size:cover;
    color:#fff;
    border-radius:4px;
    padding:64px 56px;
    margin-top:32px;
    min-height:320px;
    display:flex;
    align-items:flex-end;
  }
  .hero:after{content:"";position:absolute;top:0;right:0;border-top:72px solid var(--gold);border-left:180px solid transparent;opacity:.95}
  .hero .eyebrow{
    color:var(--gold-light);
    font-size:14px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:12px;
  }
  .hero h1{
    color:#fff;
    font-size:56px;
    font-weight:300;
    max-width:860px;
  }
  .hero p{
    color:#F8F9FA;
    font-size:18px;
    max-width:780px;
    margin-top:16px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px;
    box-shadow:none;
    padding:32px;
    margin-top:24px;
  }
  .sub{color:var(--grey);font-size:15px;margin-bottom:18px}
  .objective{
    background:var(--surface-muted);
    border-left:5px solid var(--gold);
    border-radius:4px;
    padding:20px 22px;
    margin:8px 0 20px;
  }
  .objective h3{font-size:24px;margin-bottom:8px}
  .objective p{font-size:15px;color:var(--text-secondary)}
  .pill{
    display:inline-block;
    background:var(--gold-pale);
    color:var(--navy);
    border-radius:999px;
    padding:6px 12px;
    font-size:12px;
    font-weight:600;
    margin:3px;
  }
  .btn{
    background:var(--gold);
    color:#fff;
    border:1px solid var(--gold);
    border-radius:4px;
    padding:10px 24px;
    font-family:'Libre Franklin',Arial,sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s,border-color .15s,transform .15s;
  }
  .btn:hover{background:var(--gold-hover);border-color:var(--gold-hover);transform:translateY(-1px)}
  .btn.ghost{background:#fff;color:var(--gold-dark);border:1px solid var(--gold)}
  .btn.ghost:hover{background:var(--gold-pale);border-color:var(--gold-hover)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.save{background:var(--navy);border-color:var(--navy)}
  .btn.save:hover{background:var(--navy-deep);border-color:var(--navy-deep)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .between{justify-content:space-between}
  select,input[type=text],input[type=email]{
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:4px;
    font-size:15px;
    min-width:260px;
    font-family:'Libre Franklin',Arial,sans-serif;
    background:#fff;
    color:var(--text);
  }
  select:focus,input[type=text]:focus,input[type=email]:focus{outline:2px solid var(--gold-light);border-color:var(--gold)}
  .field{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .field label{font-weight:600;color:var(--navy);min-width:160px}
  .consent-field{align-items:flex-start}
  .consent-box{max-width:620px;font-size:14px;color:var(--text-secondary);padding-top:2px}
  .consent-box label{display:flex;align-items:flex-start;gap:10px;min-width:0;color:var(--text-secondary);font-weight:400}
  .consent-box input[type=checkbox]{margin-top:4px;flex:0 0 auto}
  .progress{height:9px;background:#e9ecf2;border-radius:999px;overflow:hidden;margin:14px 0 4px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy));width:0;transition:.3s}
  .qcard{
    border:1px solid var(--border);
    border-radius:4px;
    padding:18px 18px 10px;
    margin-bottom:14px;
    background:var(--surface-muted);
  }
  .qcard.industry{background:var(--gold-pale);border-color:var(--gold-light)}
  .qtext{font-weight:600;margin-bottom:4px;color:var(--text-secondary)}
  .qhelp{color:var(--grey);font-size:13px;margin-bottom:12px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{
    flex:1;
    min-width:120px;
    border:1px solid var(--border);
    background:#fff;
    border-radius:4px;
    padding:10px 8px;
    text-align:center;
    cursor:pointer;
    font-size:12.5px;
    transition:.12s;
    user-select:none;
  }
  .opt small{display:block;color:var(--grey);font-size:11px;margin-top:2px}
  .opt:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .opt.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
  .opt.sel small{color:var(--gold-pale)}
  .pillar-head{
    color:var(--navy);
    font-weight:600;
    font-size:15px;
    margin:22px 0 12px;
    border-left:4px solid var(--gold);
    padding-left:12px;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .gauge-wrap{display:flex;gap:32px;flex-wrap:wrap;align-items:center;justify-content:center}
  .gauge{position:relative;width:170px;height:170px}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .center .num{font-family:'Oswald',Arial,sans-serif;font-size:44px;font-weight:400;color:var(--navy);line-height:1}
  .gauge .center .stg{font-weight:700;margin-top:4px}
  .ladder{flex:1;min-width:260px}
  .ladder .step{display:flex;justify-content:space-between;padding:10px 14px;border-radius:4px;background:var(--surface-muted);border:1px solid var(--border);margin-bottom:6px;font-size:14px}
  .ladder .step.active{background:var(--navy);color:#fff;font-weight:700;border-color:var(--navy)}
  .barrow{display:grid;grid-template-columns:1.2fr 2fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
  .bar{height:16px;background:#e9ecf2;border-radius:999px;overflow:hidden}
  .bar > div{height:100%;border-radius:999px;transition:.4s}
  .prio{display:flex;gap:14px;padding:16px;border-radius:4px;background:var(--surface-muted);margin-bottom:12px;border:1px solid var(--border)}
  .prio .n{flex:0 0 34px;height:34px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .prio .txt b{color:var(--navy)}
  .prio .txt p{font-size:13.5px;margin-top:4px;color:var(--text-secondary)}
  .usecases{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .usecases span{background:var(--gold-pale);color:var(--navy);border-radius:4px;padding:7px 10px;font-size:12.5px;font-weight:600}
  .savebox{
    background:var(--gold-pale);
    border:1px solid var(--gold-light);
    border-radius:4px;
    padding:18px 20px;
    margin-top:24px;
    display:flex;
    gap:16px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:space-between;
  }
  .savebox .txt b{color:var(--navy);font-size:15px}
  .savebox .txt p{color:var(--gold-dark);font-size:13px;margin-top:3px}
  .ctabox{background:var(--navy);color:#fff;border-radius:4px;padding:28px;margin-top:24px;position:relative;overflow:hidden}
  .ctabox:before{content:"";position:absolute;top:0;right:0;border-top:44px solid var(--gold);border-left:120px solid transparent;opacity:.95}
  .ctabox h3{color:#fff;font-family:'Oswald',Arial,sans-serif;font-size:28px;font-weight:400;margin-bottom:8px}
  .ctabox p{color:#F8F9FA;font-size:14px;margin-bottom:16px;max-width:880px}
  .ctagrid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .ctagrid .item{flex:1;min-width:190px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:14px 16px}
  .ctagrid .item b{display:block;font-size:14.5px;margin-bottom:4px;color:#fff}
  .ctagrid .item span{font-size:12.5px;color:#F8F9FA}
  .btn.ctawhite{background:#fff;color:var(--navy);border-color:#fff}
  .btn.ctawhite:hover{background:var(--gold-pale);border-color:var(--gold-pale)}
  .footer-note{color:var(--grey);font-size:12.5px;margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
  .devclause{background:var(--surface-muted);border:1px solid var(--border);border-radius:4px;padding:14px;font-size:12.5px;color:var(--text-secondary);margin-top:18px;display:flex;gap:14px;align-items:center}
  .devclause .logomini{flex:0 0 auto;background:#fff;padding:8px;border-radius:4px;border:1px solid var(--border)}
  .devclause .logomini img{display:block;max-height:48px;width:auto}
  .site-footer{background:var(--navy-deep);color:#fff;margin-top:48px;padding:28px 0;position:relative}
  .site-footer:before{content:"";position:absolute;top:0;right:0;border-top:6px solid var(--gold);width:180px}
  .site-footer .wrap{padding-bottom:0}
  .site-footer p{font-size:13px;color:#E8E2DA}
  .hidden{display:none!important}
  @media (max-width:760px){
    .wrap{padding-left:16px;padding-right:16px}
    header.top .wrap{min-height:auto;padding:0 16px 16px}
    .brand{width:100%;flex-direction:column;gap:12px}
    .logobox{min-height:60px;padding:10px 40px 10px 16px;clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%)}
    .brandtext{padding:0}
    .brandtext h1{font-size:24px}
    .langtoggle{align-self:flex-start}
    .hero{padding:40px 24px;min-height:280px}
    .hero h1{font-size:40px}
    h2{font-size:28px}
    .card{padding:24px}
    .barrow{grid-template-columns:1fr;gap:6px}
    select,input[type=text],input[type=email]{width:100%;min-width:0}
  }
  @media print{
    header.top .langtoggle,.noprint,.hero{display:none!important}
    body{background:#fff}
    .card{box-shadow:none;page-break-inside:avoid;border-color:#ddd}
    .ctabox{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .savebox{display:none!important}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="logobox" id="logoHeader"></span>
      <div class="brandtext">
        <h1 id="appTitle">SME AI Readiness Self-Assessment</h1>
        <p id="appSubtitle">Developed by SMU Academy · Vendor-neutral · ~15 minutes</p>
      </div>
    </div>
    <div class="langtoggle">
      <button id="btnEN" class="active" onclick="setLang('en')">EN</button>
      <button id="btnZH" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- INTRO -->
  <div class="card" id="intro">
    <h2 id="introH"></h2>
    <div class="objective">
      <h3 id="objH"></h3>
      <p id="objP"></p>
    </div>
    <p class="sub" id="introSub"></p>
    <div id="introPills" style="margin:10px 0 16px"></div>
    <div class="field">
      <label id="lblIndustry"></label>
      <select id="industry"></select>
    </div>
    <div class="field">
      <label id="lblScope"></label>
      <select id="scope"></select>
    </div>
    <div class="field">
      <label id="lblCompany"></label>
      <input type="text" id="company">
    </div>
    <div class="field">
      <label id="lblEmail"></label>
      <input type="email" id="email">
    </div>
    <div class="field consent-field">
      <label id="lblEmailPreferences"></label>
      <div class="consent-box">
        <label>
          <input type="checkbox" id="marketingConsent">
          <span id="marketingConsentText"></span>
        </label>
      </div>
    </div>
    <div class="row" style="margin-top:20px">
      <button class="btn" id="btnStart" onclick="start()"></button>
    </div>
    <div class="devclause">
      <span class="logomini" id="logoClause"></span>
      <span id="devClauseText"></span>
    </div>
    <p class="footer-note" id="introFoot"></p>
  </div>

  <!-- QUIZ -->
  <div class="card hidden" id="quiz">
    <div class="row between">
      <h2 id="quizTitle"></h2>
      <span class="pill" id="counter"></span>
    </div>
    <div class="progress"><div id="pbar"></div></div>
    <div id="questions"></div>
    <div class="row between" style="margin-top:16px">
      <button class="btn ghost" id="btnBack" onclick="backToIntro()"></button>
      <button class="btn" id="seeResults" onclick="submitAndShowResults()" disabled></button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card hidden" id="results">
    <div class="row between">
      <div>
        <h2 id="resTitle"></h2>
        <p class="sub" id="resSub"></p>
      </div>
      <div class="noprint row">
        <button class="btn ghost" id="btnRetake" onclick="restart()"></button>
        <button class="btn" id="btnPrint" onclick="window.print()"></button>
      </div>
    </div>

    <div class="gauge-wrap" style="margin:10px 0 24px">
      <div class="gauge">
        <svg width="170" height="170">
          <circle cx="85" cy="85" r="72" stroke="#e9ecf2" stroke-width="14" fill="none"/>
          <circle id="gaugeArc" cx="85" cy="85" r="72" stroke="#2E5496" stroke-width="14" fill="none"
                  stroke-linecap="round" stroke-dasharray="452" stroke-dashoffset="452"/>
        </svg>
        <div class="center"><div class="num" id="ovNum">0%</div><div class="stg" id="ovStage">—</div>
          <small style="color:var(--grey)" id="ovLbl"></small></div>
      </div>
      <div class="ladder" id="ladder"></div>
    </div>

    <div class="row" style="gap:30px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:300px">
        <h2 style="font-size:17px" id="barsH"></h2>
        <div id="bars" style="margin-top:12px"></div>
      </div>
      <div style="flex:1;min-width:300px">
        <h2 style="font-size:17px" id="radarH"></h2>
        <canvas id="radar" height="260"></canvas>
      </div>
    </div>

    <h2 style="font-size:17px;margin-top:24px" id="prioH"></h2>
    <p class="sub" id="prioSub"></p>
    <div id="priorities"></div>

    <h2 style="font-size:17px;margin-top:14px" id="ucH"></h2>
    <div class="usecases" id="usecases"></div>

    <!-- SAVE / SUBMIT TO SMUA removed: submission now happens before showing results -->
    <!-- CALL TO ACTION -->
    <div class="ctabox">
      <h3 id="ctaH"></h3>
      <p id="ctaP"></p>
      <div class="ctagrid" id="ctaGrid"></div>
      <div class="row">
        <button class="btn ctawhite" id="ctaBtn1" onclick="ctaClick()"></button>
        <button class="btn ctawhite" id="ctaBtn2" onclick="ctaClick()"></button>
      </div>
    </div>

    <p class="footer-note" id="resFoot"></p>
  </div>
</div>

<script>
/* =====================================================================
   SMU ACADEMY LOGO — paste your official logo (URL or base64) below.
   ===================================================================== */
const LOGO_SRC = "https://www.smu.edu.sg/themes/smubase_5g/assets/site-headers/logo-smu-d.svg?revised=20251228";

function smuaLogo(h){
  if(LOGO_SRC && LOGO_SRC.indexOf("PASTE_")!==0){
    return '<img src="'+LOGO_SRC+'" style="height:'+h+'px;width:auto;display:block" '
         + 'alt="SMU Academy — Singapore Management University">';
  }
  return '<div style="display:flex;flex-direction:column;justify-content:center;height:'+h+'px;'
       + 'font-family:Georgia,serif;color:#1C2A5E;line-height:1.05">'
       + '<span style="font-size:'+Math.round(h*0.34)+'px;font-weight:700;letter-spacing:1px">SMU</span>'
       + '<span style="font-size:'+Math.round(h*0.16)+'px;letter-spacing:.5px">Academy</span>'
       + '</div>';
}

/* =====================================================================
   CONTACT / BOOKING LINK (workshop / consultancy enquiries)
   ===================================================================== */
const CTA_LINK = "https://academy.smu.edu.sg/contact-us";

/* =====================================================================
   POWER AUTOMATE URL — for official capture into SharePoint List.
   Tokens the tool will substitute if present:
     %%COMPANY%%   -> entered company name
     %%SCOPE%%     -> selected scope (Overall Company / department)
   ===================================================================== */
const POWER_AUTOMATE_URL = "PASTE_YOUR_POWER_AUTOMATE_HTTP_TRIGGER_URL_HERE";

/* ================= LANGUAGE ================= */
let LANG='en';

/* Scope options (canonical EN keys) */
const SCOPES = {
 en:["Overall Company","Sales","Marketing","Operations","Finance","Human Resources","IT / Technology","Customer Service","Procurement / Supply Chain","Other"],
 zh:["整体公司","销售","市场营销","运营","财务","人力资源","IT / 技术","客户服务","采购 / 供应链","其他"]
};
const SCOPE_KEY = {};
SCOPES.en.forEach((e,i)=>{ SCOPE_KEY[e]=e; SCOPE_KEY[SCOPES.zh[i]]=e; });

const T = {
 en:{
  appTitle:"SME AI Readiness Self-Assessment",
  appSubtitle:"Developed by SMU Academy · Vendor-neutral · ~15 minutes",
  introH:"How ready is your business for AI?",
  objH:"About this tool",
  objP:"This self-assessment helps SME leaders quickly understand their organisation's readiness to adopt AI across seven core areas plus industry-specific use cases. In about 15 minutes you'll receive a readiness score, a maturity stage, and a prioritised, practical action roadmap — so you know exactly where to start and how to move forward with confidence.",
  introSub:"A quick diagnostic across 7 core pillars plus a use-case overlay for your industry. Nothing is uploaded — it runs entirely in your browser.",
  lblIndustry:"Select your industry:",
  lblScope:"Assessing for:",
  lblCompany:"Company name (optional):",
  lblEmail:"Email address:",
  lblEmailPreferences:"Email preferences:",
  marketingConsentText:"Receive occasional product updates and announcements",
  companyPH:"e.g. Bloom & Co.",
  emailPH:"e.g. name@company.com",
  btnStart:"Start Assessment →",
  devClause:"This tool is developed by SMU Academy (SMUA) and will be enhanced from time to time as AI capabilities and SME needs evolve. Your feedback helps us improve it.",
  introFoot:"Recommendations map to SG support (EDG · PSG · SFEC · SkillsFuture).",
  quizTitle:"Assessment · ",
  counter:(d,t)=>`${d} / ${t} answered`,
  btnBack:"← Change details",
  seeResults:"Submit and see my results →",
  resTitle:"Your AI Readiness Results",
  resSub:(ind,scope,date)=>`Industry: ${ind}  ·  Scope: ${scope}  ·  ${date}`,
  btnRetake:"↺ Retake",

/* Submit assessment to SharePoint via Power Automate. */
async function submitAssessmentToSharePoint(){
  const email = document.getElementById('email').value.trim();

  if(!email){
    alert(LANG==='zh'
      ? "请填写电邮地址后再提交。"
      : "Please enter your email address before submitting.");
    return false;
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    alert(LANG==='zh'
      ? "请输入有效的电邮地址。"
      : "Please enter a valid email address.");
    return false;
  }

  const {scores, overall} = computeScores();
  const company = document.getElementById('company').value.trim();
  const marketingConsent = document.getElementById('marketingConsent').checked;

  const payload = {
    submittedAt: new Date().toISOString(),
    company: company,
    email: email,
    emailPreferences: marketingConsent ? "Opted in" : "Not opted in",
    marketingConsent: marketingConsent,
    industry: industryKey,
    industryLabel: industryLabel(),
    scope: scopeKey,
    scopeLabel: scopeLabel(),
    language: LANG,
    overallScore: overall,
    maturityStage: STAGES.en[stageIndex(overall)][0],
    scores: scores,
    answers: items.map((item, index) => ({
      pillar: item.pkey,
      questionEnglish: item.en,
      questionChinese: item.zh,
      answer: answers[index]
    }))
  };

  if(!POWER_AUTOMATE_URL || POWER_AUTOMATE_URL.indexOf("PASTE_")===0){
    console.warn("Power Automate URL is not configured. Payload preview:", payload);
    alert(LANG==='zh'
      ? "提交链接尚未配置。结果将继续显示，但不会保存到 SharePoint。"
      : "Submission link is not configured yet. Results will be shown, but not saved to SharePoint.");
    return true;
  }

  try{
    /* Power Automate HTTP triggers often do not return browser CORS headers.
       no-cors allows the browser to send the request, but it cannot confirm the response.
       Check the Power Automate run history and SharePoint List to verify receipt. */
    await fetch(POWER_AUTOMATE_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify(payload)
    });

    return true;
  }catch(error){
    console.error("SharePoint submission failed:", error);
    alert(LANG==='zh'
      ? "提交时发生错误。请稍后再试。"
      : "There was an error submitting your responses. Please try again.");
    return false;
  }
}

/* ================= ITEMS ================= */
function buildItems(){
  items=[];
  CORE.forEach((qs,pi)=>qs.forEach(q=>items.push({pIndex:pi,pkey:PKEYS[pi],en:q[0],enh:q[1],zh:q[2],zhh:q[3],ind:false})));
  OVERLAYS[industryKey].forEach(q=>items.push({pIndex:7,pkey:PKEYS[7],en:q[0],enh:q[1],zh:q[2],zhh:q[3],ind:true}));
}

/* ================= FLOW ================= */
function start(){
  industryKey=document.getElementById('industry').value;
  scopeKey=document.getElementById('scope').value;
  answers={};hasResults=false;buildItems();
  document.getElementById('intro').classList.add('hidden');
  const hero = document.getElementById('hero');
if (hero) {
    hero.classList.add('hidden');
}
  document.getElementById('results').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestions();updateProgress();window.scrollTo({top:0,behavior:'smooth'});
}
function backToIntro(){document.getElementById('quiz').classList.add('hidden');document.getElementById('intro').classList.remove('hidden');const hero = document.getElementById('hero'); if (hero) {     hero.classList.remove('hidden'); }window.scrollTo({top:0,behavior:'smooth'});}
function industryLabel(){const i=INDUSTRIES.en.indexOf(industryKey);return INDUSTRIES[LANG][i>=0?i:0];}
function scopeLabel(){const i=SCOPES.en.indexOf(scopeKey);return SCOPES[LANG][i>=0?i:0];}
function pillarLabel(pi){return PILLARS[LANG][pi];}

function renderQuestions(){
  document.getElementById('quizTitle').textContent=T[LANG].quizTitle+industryLabel()+" · "+scopeLabel();
  const wrap=document.getElementById('questions');wrap.innerHTML="";let last=-1;
  items.forEach((it,idx)=>{
    if(it.pIndex!==last){const h=document.createElement('div');h.className='pillar-head';h.textContent=it.ind?pillarLabel(7)+" · "+industryLabel():pillarLabel(it.pIndex);wrap.appendChild(h);last=it.pIndex;}
    const c=document.createElement('div');c.className='qcard'+(it.ind?' industry':'');
    const qt=LANG==='zh'?it.zh:it.en,qh=LANG==='zh'?it.zhh:it.enh;
    c.innerHTML=`<div class="qtext">${qt}</div><div class="qhelp">${qh}</div>`;
    const opts=document.createElement('div');opts.className='opts';
    const LIKERT=LANG==='zh'?[[0,"完全没有","/ 不清楚"],[1,"刚起步","/ 临时性"],[2,"部分","到位"],[3,"大致","到位"],[4,"完全/先进","到位"]]:[[0,"Not at all","/ Don't know"],[1,"Just starting","/ Ad hoc"],[2,"Partially","in place"],[3,"Mostly","in place"],[4,"Fully / Advanced","in place"]];
    LIKERT.forEach(o=>{const b=document.createElement('div');b.className='opt';b.innerHTML=`${o[0]} · ${o[1]}<small>${o[2]}</small>`;if(answers[idx]===o[0])b.classList.add('sel');b.onclick=()=>{answers[idx]=o[0];[...opts.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');updateProgress();};opts.appendChild(b);});
    c.appendChild(opts);wrap.appendChild(c);
  });
}
function updateProgress(){const done=Object.keys(answers).length,total=items.length;document.getElementById('counter').textContent=T[LANG].counter(done,total);document.getElementById('pbar').style.width=(done/total*100)+"%";document.getElementById('seeResults').disabled=done<total;}

/* ================= SCORING ================= */
function computeScores(){
  const agg={};PKEYS.forEach(k=>agg[k]={sum:0,n:0});
  items.forEach((it,idx)=>{const v=answers[idx]||0;agg[it.pkey].sum+=v;agg[it.pkey].n++;});
  const scores={};PKEYS.forEach(k=>{const{sum,n}=agg[k];scores[k]=n?Math.round(sum/(n*4)*100):0;});
  const vals=Object.values(scores);const overall=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  return{scores,overall};
}

/* ================= RESULTS ================= */
async function submitAndShowResults(){
  const submitted = await submitAssessmentToSharePoint();
  if(submitted){
    showResults();
  }
}

function showResults(keepScroll){
  hasResults=true;const{scores,overall}=computeScores();const t=T[LANG];
  const company=document.getElementById('company').value.trim();
  lastResult={company,scope:scopeKey,industry:industryKey,scores,overall,stage:STAGES.en[stageIndex(overall)][0]};
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  document.getElementById('resTitle').textContent=(company?company+" — ":"")+t.resTitle;
  document.getElementById('resSub').textContent=t.resSub(industryLabel(),scopeLabel(),new Date().toLocaleDateString(LANG==='zh'?'zh-CN':'en-GB'));
  const arc=document.getElementById('gaugeArc'),circ=452;arc.style.stroke=bandColor(overall);arc.style.strokeDashoffset=circ-(circ*overall/100);
  document.getElementById('ovNum').textContent=overall+"%";
  const si=stageIndex(overall);const os=document.getElementById('ovStage');os.textContent=STAGES[LANG][si][0];os.style.color=bandColor(overall);
  const ld=document.getElementById('ladder');ld.innerHTML="";
  STAGES[LANG].forEach((row,i)=>{const[n,a,b]=row;const act=(i===si);const d=document.createElement('div');d.className='step'+(act?' active':'');d.innerHTML=`<span>${n}${act?t.youAreHere:''}</span><span>${a}–${b}%</span>`;ld.appendChild(d);});
  const bars=document.getElementById('bars');bars.innerHTML="";
  PKEYS.forEach((k,i)=>{const val=scores[k];const row=document.createElement('div');row.className='barrow';row.innerHTML=`<div>${pillarLabel(i)}</div><div class="bar"><div style="width:${val}%;background:${bandColor(val)}"></div></div><b>${val}%</b>`;bars.appendChild(row);});
  const ctx=document.getElementById('radar');if(radarChart)radarChart.destroy();
  radarChart=new Chart(ctx,{type:'radar',data:{labels:PILLS[LANG],datasets:[{label:t.radarLabel,data:PKEYS.map(k=>scores[k]),fill:true,backgroundColor:'rgba(46,84,150,.25)',borderColor:'#2E5496',pointBackgroundColor:'#1C2A5E'}]},options:{responsive:true,scales:{r:{min:0,max:100,ticks:{stepSize:20}}},plugins:{legend:{display:false}}}});
  const low=[...PKEYS].sort((a,b)=>scores[a]-scores[b]).slice(0,3);
  const pr=document.getElementById('priorities');pr.innerHTML="";
  low.forEach((k,i)=>{const val=scores[k];const pi=PKEYS.indexOf(k);const d=document.createElement('div');d.className='prio';d.innerHTML=`<div class="n" style="background:${bandColor(val)}">${i+1}</div><div class="txt"><b>${pillarLabel(pi)} — ${val}% (${STAGES[LANG][stageIndex(val)][0]})</b><p>${RECS[LANG][k]}</p></div>`;pr.appendChild(d);});
  const uc=document.getElementById('usecases');uc.innerHTML="";
  USECASES[LANG][industryKey].forEach(x=>{const s=document.createElement('span');s.textContent=x;uc.appendChild(s);});
  if(!keepScroll)window.scrollTo({top:0,behavior:'smooth'});
}
