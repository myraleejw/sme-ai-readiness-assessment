<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMU Academy · AI Adoption Assessment | 新大专业进修学院 人工智能应用评估</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141C52;
    --navy-deep:#0B0F2C;
    --gold:#8A704C;
    --gold-dark:#6E5A3D;
    --gold-hover:#755F41;
    --gold-light:#D0C6B7;
    --gold-pale:#E8E2DA;
    --surface:#FFFFFF;
    --surface-subtle:#F9F7F3;
    --surface-muted:#F8F9FA;
    --border:#DEE2E6;
    --text:#000000;
    --text-secondary:#212529;
    --grey:#6C757D;
    --red:#D64545;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Libre Franklin','Microsoft YaHei','PingFang SC',Arial,Helvetica,sans-serif;
    color:var(--text);
    background:var(--surface-subtle);
    line-height:1.5;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px 64px}
  header.top{background:var(--navy);border-bottom:4px solid var(--gold);padding:0}
  header.top .wrap{
    min-height:100px;
    display:flex;
    justify-content:space-between;
    align-items:stretch;
    gap:24px;
    flex-wrap:wrap;
    padding-bottom:0;
  }
  .brand{display:flex;align-items:stretch;gap:28px;min-width:0}
  .logobox{
    background:#fff;
    min-height:100px;
    padding:16px 48px 16px 24px;
    display:flex;
    align-items:center;
    flex:0 0 auto;
    clip-path:polygon(0 0,100% 0,calc(100% - 48px) 100%,0 100%);
  }
  .logobox img{display:block;max-height:64px;width:auto}
  .logofallback{
    font-family:'Oswald',Arial,sans-serif;
    font-size:24px;
    color:var(--navy);
    letter-spacing:.5px;
    white-space:nowrap;
  }
  .brandtext{display:flex;flex-direction:column;justify-content:center;padding:14px 0;min-width:0}
  .brandtext h1{
    font-family:'Oswald',Arial,sans-serif;
    font-size:30px;
    font-weight:400;
    color:#fff;
    line-height:1.2;
    letter-spacing:.01em;
  }
  .langtoggle{
    align-self:center;
    display:flex;
    border:1px solid var(--gold-light);
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,.08);
  }
  .langtoggle button{
    background:transparent;
    color:#fff;
    border:none;
    padding:8px 18px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    font-family:'Libre Franklin',Arial,sans-serif;
  }
  .langtoggle button.active{background:#fff;color:var(--navy)}
  h1,h2,h3,h4{
    font-family:'Oswald','Libre Franklin',Arial,sans-serif;
    font-weight:400;
    color:var(--navy);
    line-height:1.25;
  }
  h2{font-size:32px;margin-bottom:12px}
  .errbar{
    display:none;
    background:#FDECEC;
    border:1px solid var(--red);
    border-left:5px solid var(--red);
    color:#7A1F1F;
    padding:14px 18px;
    margin-top:24px;
    border-radius:4px;
    font-size:13.5px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .errbar.show{display:block}
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px;
    padding:32px;
    margin-top:24px;
  }
  .sub{color:var(--grey);font-size:15px;margin-bottom:18px}
  .printhint{
    color:var(--gold-dark);
    font-size:13.5px;
    margin:-10px 0 18px;
  }
  .objective{
    background:var(--surface-muted);
    border-left:5px solid var(--gold);
    border-radius:4px;
    padding:20px 22px;
    margin:8px 0 20px;
  }
  .objective h3{font-size:24px;margin-bottom:8px}
  .objective p{font-size:15px;color:var(--text-secondary)}
  .pillarlist{
    list-style:none;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:6px 24px;
    margin:10px 0 20px;
    padding:0;
  }
  .pillarlist li{
    position:relative;
    padding-left:18px;
    font-size:14px;
    color:var(--text-secondary);
    line-height:1.6;
  }
  .pillarlist li:before{
    content:"";
    position:absolute;
    left:0;
    top:9px;
    width:6px;
    height:6px;
    background:var(--gold);
    border-radius:50%;
  }
  .pillarlist-label{
    font-size:14px;
    font-weight:600;
    color:var(--navy);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-top:6px;
  }
  .btn{
    background:var(--gold);
    color:#fff;
    border:1px solid var(--gold);
    border-radius:4px;
    padding:10px 24px;
    font-family:'Libre Franklin',Arial,sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    display:inline-block;
    text-align:center;
    text-decoration:none;
    transition:background .15s,border-color .15s,transform .15s;
  }
  .btn:hover{background:var(--gold-hover);border-color:var(--gold-hover);transform:translateY(-1px)}
  .btn.ghost{background:#fff;color:var(--gold-dark);border:1px solid var(--gold)}
  .btn.ghost:hover{background:var(--gold-pale);border-color:var(--gold-hover)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.link{
    background:none;
    border:none;
    color:var(--gold-dark);
    text-decoration:underline;
    padding:4px 0;
    font-size:13.5px;
  }
  .btn.link:hover{color:var(--navy);transform:none;background:none}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .between{justify-content:space-between}
  select,input[type=text],input[type=email]{
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:4px;
    font-size:15px;
    min-width:260px;
    font-family:'Libre Franklin',Arial,sans-serif;
    background:#fff;
    color:var(--text);
  }
  select:focus,input[type=text]:focus,input[type=email]:focus{outline:2px solid var(--gold-light);border-color:var(--gold)}
  .field{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .field label{font-weight:600;color:var(--navy);min-width:160px}
  .optional{font-weight:400;color:var(--grey);font-size:13px}
  .consent-field{align-items:flex-start}
  .consent-box{max-width:620px;font-size:14px;color:var(--text-secondary);padding-top:2px}
  .consent-box label{display:flex;align-items:flex-start;gap:10px;min-width:0;color:var(--text-secondary);font-weight:400}
  .consent-box input[type=checkbox]{margin-top:4px;flex:0 0 auto}

  /* ---------- STICKY PROGRESS BAR ---------- */
  .stickybar{
    position:sticky;
    top:0;
    z-index:30;
    background:var(--surface);
    margin:-32px -32px 18px;
    padding:18px 32px 12px;
    border-bottom:1px solid var(--border);
    border-radius:4px 4px 0 0;
  }
  .stickybar h2{font-size:19px;margin:0;line-height:1.3}
  .stickybar .counter{color:var(--grey);font-size:14px;white-space:nowrap}
  .progress{height:9px;background:#e9ecf2;border-radius:999px;overflow:hidden;margin:12px 0 0}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy));width:0;transition:.3s}

  .qcard{
    border:1px solid var(--border);
    border-radius:4px;
    padding:18px 18px 10px;
    margin-bottom:14px;
    background:var(--surface-muted);
    scroll-margin-top:120px;
  }
  .qcard.industry{background:var(--gold-pale);border-color:var(--gold-light)}
  .qcard.missing{border-color:var(--red);box-shadow:0 0 0 2px rgba(214,69,69,.15)}
  .qtext{font-weight:600;margin-bottom:4px;color:var(--text-secondary)}
  .qhelp{color:var(--grey);font-size:13px;margin-bottom:12px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{
    flex:1;
    min-width:120px;
    border:1px solid var(--border);
    background:#fff;
    border-radius:4px;
    padding:10px 8px;
    text-align:center;
    cursor:pointer;
    font-size:12.5px;
    transition:.12s;
    user-select:none;
  }
  .opt small{display:block;color:var(--grey);font-size:11px;margin-top:2px}
  .opt:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .opt.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
  .opt.sel small{color:var(--gold-pale)}
  .pillar-head{
    color:var(--navy);
    font-weight:600;
    font-size:15px;
    margin:22px 0 12px;
    border-left:4px solid var(--gold);
    padding-left:12px;
    text-transform:uppercase;
    letter-spacing:.02em;
    scroll-margin-top:120px;
  }
  .gauge-wrap{display:flex;gap:32px;flex-wrap:wrap;align-items:center;justify-content:center}
  .gauge{position:relative;width:170px;height:170px}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .center .num{font-family:'Oswald',Arial,sans-serif;font-size:44px;font-weight:400;color:var(--navy);line-height:1}
  .gauge .center .stg{font-weight:700;margin-top:4px}
  .ladder{flex:1;min-width:260px}
  .ladder .step{display:flex;justify-content:space-between;padding:10px 14px;border-radius:4px;background:var(--surface-muted);border:1px solid var(--border);margin-bottom:6px;font-size:14px}
  .ladder .step.active{background:var(--navy);color:#fff;font-weight:700;border-color:var(--navy)}
  .resultcols{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
  .resultcol{flex:1 1 320px;min-width:300px}
  .barrow{display:grid;grid-template-columns:1.2fr 2fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
  .bar{height:16px;background:#e9ecf2;border-radius:999px;overflow:hidden}
  .bar > div{height:100%;border-radius:999px;transition:.4s}
  .prio{display:flex;gap:14px;padding:16px;border-radius:4px;background:var(--surface-muted);margin-bottom:12px;border:1px solid var(--border)}
  .prio .n{flex:0 0 34px;height:34px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .prio .txt b{color:var(--navy)}
  .prio .txt p{font-size:13.5px;margin-top:4px;color:var(--text-secondary)}
  .usecases{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .usecases span{background:var(--gold-pale);color:var(--navy);border-radius:4px;padding:7px 10px;font-size:12.5px;font-weight:600}
  .ctabox{background:var(--navy);color:#fff;border-radius:4px;padding:28px;margin-top:24px;position:relative;overflow:hidden}
  .ctabox:before{content:"";position:absolute;top:0;right:0;border-top:44px solid var(--gold);border-left:120px solid transparent;opacity:.95}
  .ctabox h3{color:#fff;font-family:'Oswald',Arial,sans-serif;font-size:28px;font-weight:400;margin-bottom:8px}
  .ctabox p{color:#F8F9FA;font-size:14px;margin-bottom:16px;max-width:880px}
  .ctagrid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .ctagrid .item{flex:1;min-width:190px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:14px 16px}
  .ctagrid .item b{display:block;font-size:14.5px;margin-bottom:4px;color:#fff}
  .ctagrid .item span{font-size:12.5px;color:#F8F9FA}
  .btn.ctawhite{background:#fff;color:var(--navy);border-color:#fff}
  .btn.ctawhite:hover{background:var(--gold-pale);border-color:var(--gold-pale)}
  .footer-note{color:var(--grey);font-size:12.5px;margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
  .devclause{background:var(--surface-muted);border:1px solid var(--border);border-radius:4px;padding:16px 18px;font-size:12.5px;color:var(--text-secondary);margin-top:18px}
  #devClauseText{white-space:pre-line}
  .hidden{display:none!important}
  .printonly{display:none}

  @media (max-width:760px){
    .wrap{padding-left:16px;padding-right:16px}
    header.top .wrap{min-height:auto;padding:0 16px 16px}
    .brand{width:100%;flex-direction:column;gap:12px}
    .logobox{min-height:60px;padding:10px 40px 10px 16px;clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%)}
    .logobox img{max-height:44px}
    .brandtext{padding:0}
    .brandtext h1{font-size:24px}
    .langtoggle{align-self:flex-start}
    h2{font-size:28px}
    .card{padding:24px}
    .stickybar{margin:-24px -24px 16px;padding:14px 24px 10px}
    .stickybar h2{font-size:16px}
    .qcard{scroll-margin-top:150px}
    .barrow{grid-template-columns:1fr;gap:6px}
    select,input[type=text],input[type=email]{width:100%;min-width:0}
    .printhint{margin-top:0}
  }

  /* ===================== PRINT / SAVE AS PDF ===================== */
  @page{margin:14mm 12mm}
  @media print{
    html,body{
      background:#fff!important;
      font-size:10.5pt;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .langtoggle,.noprint,#intro,#quiz,.errbar,.printhint{display:none!important}
    .printonly{display:block!important}
    header.top{
      background:#fff!important;
      border-bottom:2px solid var(--gold);
      margin-bottom:14px;
    }
    header.top .wrap{
      min-height:0;
      padding:0 0 10px;
      display:flex;
      align-items:center;
      gap:16px;
    }
    .brand{flex-direction:row;align-items:center;gap:16px;width:100%}
    .logobox{background:none;min-height:0;padding:0;clip-path:none}
    .logobox img{max-height:46px}
    .brandtext{padding:0}
    .brandtext h1{color:var(--navy)!important;font-size:18pt}
    .wrap{max-width:100%;width:100%;margin:0;padding:0}
    .card{border:none;padding:0;margin:0;box-shadow:none;background:#fff}
    #results .row.between{display:block}
    #results h2{margin-top:14px}
    .sub{margin-bottom:10px}
    .gauge-wrap{
      justify-content:flex-start;
      gap:24px;
      margin:8px 0 16px!important;
      page-break-inside:avoid;
      break-inside:avoid;
    }
    .gauge{width:150px;height:150px}
    .gauge svg{width:150px;height:150px}
    .ladder{min-width:0;flex:1 1 300px}
    .ladder .step{padding:6px 10px;font-size:10pt;margin-bottom:4px}
    .resultcols{display:block}
    .resultcol{
      width:100%;
      min-width:0;
      margin-bottom:18px;
      page-break-inside:avoid;
      break-inside:avoid;
    }
    canvas#radar{
      max-width:420px!important;
      max-height:320px!important;
      width:420px!important;
      height:320px!important;
    }
    .barrow{
      grid-template-columns:1.4fr 2fr auto;
      page-break-inside:avoid;
      break-inside:avoid;
      margin-bottom:7px;
    }
    .prio{
      page-break-inside:avoid;
      break-inside:avoid;
      border:1px solid #ddd;
      margin-bottom:8px;
      padding:10px 12px;
    }
    .usecases span{border:1px solid var(--gold-light)}
    .ctabox{page-break-inside:avoid;break-inside:avoid;padding:18px;margin-top:18px}

    /* Keep the CTA link visible and clickable inside the saved PDF */
    .ctabox .row{display:flex!important}
    a.btn.ctawhite{
      background:#fff!important;
      color:var(--navy)!important;
      border:1px solid var(--navy)!important;
      text-decoration:none!important;
      padding:8px 16px;
      font-size:10pt;
    }
    .ctalink-note{
      color:#F8F9FA;
      font-size:9pt;
      margin-top:10px;
      word-break:break-all;
    }
    .footer-note{margin-top:14px;page-break-inside:avoid;break-inside:avoid}
    a[href]:after{content:""}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="logobox" id="logoHeader"><span class="logofallback">SMU Academy</span></span>
      <div class="brandtext">
        <h1 id="appTitle">AI Adoption Assessment</h1>
      </div>
    </div>
    <div class="langtoggle">
      <button id="btnEN" class="active" type="button">EN</button>
      <button id="btnZH" type="button">中文</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="errbar" id="errBar"></div>

  <!-- INTRO -->
  <div class="card" id="intro">
    <h2 id="introH">How ready is your organisation for AI?</h2>
    <div class="objective">
      <h3 id="objH">About this tool</h3>
      <p id="objP"></p>
    </div>
    <p class="sub" id="introSub"></p>
    <p class="pillarlist-label" id="pillarListLabel"></p>
    <ul class="pillarlist" id="introPills"></ul>
    <div class="field">
      <label id="lblIndustry"></label>
      <select id="industry" required></select>
    </div>
    <div class="field">
      <label id="lblScope"></label>
      <select id="scope" required></select>
    </div>
    <div class="field">
      <label id="lblCompany"></label>
      <input type="text" id="company" required>
    </div>
    <div class="field">
      <label id="lblEmail"></label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label id="lblReferredBy"></label>
      <select id="referredBy"></select>
    </div>
    <div class="field consent-field">
      <label id="lblEmailPreferences"></label>
      <div class="consent-box">
        <label>
          <input type="checkbox" id="marketingConsent">
          <span id="marketingConsentText"></span>
        </label>
      </div>
    </div>
    <div class="row" style="margin-top:20px">
      <button class="btn" id="btnStart" type="button">Start Assessment</button>
    </div>
    <div class="objective" style="margin-top:20px">
      <h3 id="consentClauseTitle"></h3>
      <p id="consentClauseText1"></p>
      <p id="consentClauseText2" style="margin-top:10px"></p>
      <p id="consentClauseText3" style="margin-top:10px"></p>
      <p style="margin-top:10px">
        <a href="https://www.smu.edu.sg/personal-data-protection-statement" target="_blank" rel="noopener noreferrer" id="consentClauseLink"></a>
      </p>
    </div>
    <div class="devclause">
      <span id="devClauseText"></span>
    </div>
    <p class="footer-note" id="introFoot"></p>
  </div>

  <!-- QUIZ -->
  <div class="card hidden" id="quiz">
    <div class="stickybar">
      <div class="row between">
        <h2 id="quizTitle"></h2>
        <span class="counter" id="counter"></span>
      </div>
      <div class="progress"><div id="pbar"></div></div>
      <button class="btn link hidden" id="btnJump" type="button"></button>
    </div>
    <div id="questions"></div>
    <div class="row between" style="margin-top:16px">
      <button class="btn ghost" id="btnBack" type="button"></button>
      <button class="btn" id="seeResults" type="button" disabled></button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card hidden" id="results">
    <div class="row between">
      <div>
        <h2 id="resTitle"></h2>
        <p class="sub" id="resSub"></p>
      </div>
      <div class="noprint row">
        <button class="btn ghost" id="btnRetake" type="button"></button>
        <button class="btn" id="btnPrint" type="button"></button>
      </div>
    </div>

    <p class="printhint noprint" id="printHint"></p>

    <div class="gauge-wrap" style="margin:10px 0 24px">
      <div class="gauge">
        <svg width="170" height="170" viewBox="0 0 170 170">
          <circle cx="85" cy="85" r="72" stroke="#e9ecf2" stroke-width="14" fill="none"/>
          <circle id="gaugeArc" cx="85" cy="85" r="72" stroke="#2E5496" stroke-width="14" fill="none"
                  stroke-linecap="round" stroke-dasharray="452" stroke-dashoffset="452"/>
        </svg>
        <div class="center"><div class="num" id="ovNum">0%</div><div class="stg" id="ovStage">—</div>
          <small style="color:var(--grey)" id="ovLbl"></small></div>
      </div>
      <div class="ladder" id="ladder"></div>
    </div>

    <div class="resultcols">
      <div class="resultcol">
        <h2 style="font-size:17px" id="barsH"></h2>
        <div id="bars" style="margin-top:12px"></div>
      </div>
      <div class="resultcol">
        <h2 style="font-size:17px" id="radarH"></h2>
        <canvas id="radar" height="260"></canvas>
      </div>
    </div>

    <h2 style="font-size:17px;margin-top:24px" id="prioH"></h2>
    <p class="sub" id="prioSub"></p>
    <div id="priorities"></div>

    <h2 style="font-size:17px;margin-top:14px" id="ucH"></h2>
    <div class="usecases" id="usecases"></div>

    <div class="ctabox">
      <h3 id="ctaH"></h3>
      <p id="ctaP"></p>
      <div class="ctagrid" id="ctaGrid"></div>
      <div class="row">

  for(var i=0;i<S.length;i++){ if(p>=S[i][1] && p<=S[i][2]) return i; }

function bandColor(p){
  return p<=20 ? '#D64545' : p<=40 ? '#E67E22' : p<=60 ? '#E8B800' : p<=80 ? '#7DBB4F' : '#2E9E5B';
}

/* =====================================================================
   ENGLISH PLAIN-TEXT OUTPUTS (for SharePoint / Power BI)
   ===================================================================== */
var ANSWER_LABELS_EN = {
  0:"Not at all / Don't know",
  1:"Just starting / Ad hoc",
  2:"Partially in place",
  3:"Mostly in place",
  4:"Fully / Advanced"
};

function buildScoresText(scores){
  return PKEYS.map(function(pillar){ return pillar + ": " + scores[pillar] + "%"; }).join('\n');
}

function buildAnswersText(){
  var currentPillar = "";
  var lines = [];
  items.forEach(function(item, index){
    if(item.pkey !== currentPillar){
      if(lines.length > 0) lines.push("", "--------------------------------------------------", "");
      currentPillar = item.pkey;
      lines.push(currentPillar, "");
    }
    var numericAnswer = answers[index];
    lines.push("Question: " + item.en);
    lines.push("Answer: " + numericAnswer + " - " + ANSWER_LABELS_EN[numericAnswer], "");
  });
  return lines.join('\n').trim();
}

function buildResultsSummaryText(scores, overall){
  var stage = STAGES.en[stageIndex(overall)][0];
  var low = PKEYS.slice().sort(function(a,b){ return scores[a] - scores[b]; }).slice(0,3);
  var companyEl = document.getElementById('company');
  var company = companyEl ? companyEl.value.trim() : "";
  var lines = [];
  lines.push("AI ADOPTION ASSESSMENT — RESULTS SUMMARY");
  lines.push("Organisation: " + (company || "-"));
  lines.push("Industry: " + industryKey);
  lines.push("Scope: " + scopeKey);
  lines.push("Referred by: " + (referrerKey || "-"));
  lines.push("Date: " + new Date().toLocaleDateString('en-GB'));
  lines.push("");
  lines.push("Overall readiness: " + overall + "% (" + stage + ")");
  lines.push("");
  lines.push("READINESS BY PILLAR");
  lines.push(buildScoresText(scores));
  lines.push("");
  lines.push("TOP 3 PRIORITIES");
  low.forEach(function(k, i){
    lines.push((i+1) + ". " + k + " — " + scores[k] + "% (" + STAGES.en[stageIndex(scores[k])][0] + ")");
    lines.push("   " + RECS.en[k]);
  });
  lines.push("");
  lines.push("COMMON AI USE CASES FOR YOUR INDUSTRY");
  lines.push(USECASES.en[industryKey].map(function(u){ return "- " + u; }).join('\n'));
  lines.push("");
  lines.push("This is a self-assessment guide, not professional advice. Developed and periodically enhanced by SMU Academy.");
  return lines.join('\n');
}

/* Submit assessment to SharePoint via Power Automate. */
function submitAssessmentToSharePoint(){
  var emailField = document.getElementById('email');
  var email = emailField ? emailField.value.trim() : "";
  if(!email){
    alert(LANG==='zh' ? "请填写电邮地址后再提交。" : "Please enter your email address before submitting.");
    return Promise.resolve(false);
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    alert(LANG==='zh' ? "请输入有效的电邮地址。" : "Please enter a valid email address.");
    return Promise.resolve(false);
  }

  var computed = computeScores();
  var scores = computed.scores, overall = computed.overall;
  var company = document.getElementById('company').value.trim();
  var marketingConsent = document.getElementById('marketingConsent').checked;

  var answersJSON = items.map(function(item, index){
    return {
      pillar: item.pkey,
      questionEnglish: item.en,
      questionChinese: item.zh,
      answer: answers[index],
      answerEnglish: ANSWER_LABELS_EN[answers[index]]
    };
  });

  var payload = {
    submittedAt: new Date().toISOString(),
    assessmentName: "AI Adoption Assessment",
    assessmentVersion: ASSESSMENT_VERSION,
    company: company,
    email: email,
    marketingConsent: marketingConsent,
    referredBy: referrerKey,
    industry: industryKey,
    industryLabel: industryLabel(),
    scope: scopeKey,
    scopeLabel: scopeLabel(),
    language: LANG,
    overallScore: overall,
    maturityStage: STAGES.en[stageIndex(overall)][0],
    scores: scores,
    answers: answersJSON,
    scoresText: buildScoresText(scores),
    answersText: buildAnswersText(),
    resultsSummaryText: buildResultsSummaryText(scores, overall)
  };

  if(!POWER_AUTOMATE_URL){
    if(window.console) console.warn("Power Automate URL is not configured. Payload preview:", payload);
    alert(LANG==='zh' ? "提交链接尚未配置。结果将继续显示，但不会保存。" : "Submission link is not configured yet. Results will be shown, but not saved.");
    return Promise.resolve(true);
  }

  return fetch(POWER_AUTOMATE_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function(response){
    if(!response.ok) throw new Error("Power Automate returned HTTP " + response.status);
    return true;
  }).catch(function(error){
    if(window.console) console.error("Submission failed:", error);
    alert(LANG==='zh' ? "提交时发生错误，请稍后再试。" : "There was an error submitting your responses. Please try again.");
    return false;
  });
}

/* ================= ITEMS ================= */
function buildItems(){
  items = [];
  CORE.forEach(function(qs, pi){
    qs.forEach(function(q){
      items.push({ pIndex:pi, pkey:PKEYS[pi], en:q[0], enh:q[1], zh:q[2], zhh:q[3], ind:false });
    });
  });
  OVERLAYS[industryKey].forEach(function(q){
    items.push({ pIndex:7, pkey:PKEYS[7], en:q[0], enh:q[1], zh:q[2], zhh:q[3], ind:true });
  });
}

/* ================= FLOW ================= */
function start(){
  var industryField = document.getElementById('industry');
  var scopeField = document.getElementById('scope');
  var companyField = document.getElementById('company');
  var emailField = document.getElementById('email');
  var selectedIndustry = industryField.value.trim();
  var selectedScope = scopeField.value.trim();
  var company = companyField.value.trim();
  var email = emailField.value.trim();

  if(!selectedIndustry){
    alert(LANG==='zh' ? "请选择贵机构所属行业。" : "Please select your industry.");
    industryField.focus(); return;
  }
  if(!selectedScope){
    alert(LANG==='zh' ? "请选择评估范围。" : "Please select what the assessment is for.");
    scopeField.focus(); return;
  }
  if(!company){
    alert(LANG==='zh' ? "请填写机构名称。" : "Please enter your organisation name.");
    companyField.focus(); return;
  }
  if(!email){
    alert(LANG==='zh' ? "请填写电邮地址。" : "Please enter your email address.");
    emailField.focus(); return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    alert(LANG==='zh' ? "请输入有效的电邮地址。" : "Please enter a valid email address.");
    emailField.focus(); return;
  }

  industryKey = selectedIndustry;
  scopeKey = selectedScope;
  referrerKey = document.getElementById('referredBy').value || "";
  answers = {};
  hasResults = false;
  buildItems();
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestions();
  updateProgress();
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* Warn before returning to the details page — answers will be cleared. */
function backToIntro(){
  var answered = Object.keys(answers).length;
  if(answered > 0){
    if(!window.confirm(T[LANG].backWarn(answered))) return;
  }
  answers = {};
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  window.scrollTo({ top:0, behavior:'smooth' });
}

function industryLabel(){
  var i = INDUSTRIES.en.indexOf(industryKey);
  return INDUSTRIES[LANG][i>=0 ? i : 0];
}
function scopeLabel(){
  var i = SCOPES.en.indexOf(scopeKey);
  return SCOPES[LANG][i>=0 ? i : 0];
}
function pillarLabel(pi){ return PILLARS[LANG][pi]; }

function renderQuestions(){
  setText('quizTitle', T[LANG].quizTitle + industryLabel() + " · " + scopeLabel());
  var wrap = document.getElementById('questions');
  if(!wrap) return;
  wrap.innerHTML = "";
  var last = -1;

  items.forEach(function(it, idx){
    if(it.pIndex !== last){
      var h = document.createElement('div');
      h.className = 'pillar-head';
      h.textContent = it.ind ? (pillarLabel(7) + " · " + industryLabel()) : pillarLabel(it.pIndex);
      wrap.appendChild(h);
      last = it.pIndex;
    }
    var c = document.createElement('div');
    c.className = 'qcard' + (it.ind ? ' industry' : '');
    c.id = 'q' + idx;

    var qt = (LANG==='zh') ? it.zh : it.en;
    var qh = (LANG==='zh') ? it.zhh : it.enh;

    var qtDiv = document.createElement('div');
    qtDiv.className = 'qtext';
    qtDiv.textContent = qt;
    var qhDiv = document.createElement('div');
    qhDiv.className = 'qhelp';
    qhDiv.textContent = qh;
    c.appendChild(qtDiv);
    c.appendChild(qhDiv);

    var opts = document.createElement('div');
    opts.className = 'opts';

    var LIKERT = (LANG==='zh')
      ? [[0,"完全没有","／不清楚"],[1,"刚起步","／临时性"],[2,"部分","具备"],[3,"大致","具备"],[4,"完全／先进","具备"]]
      : [[0,"Not at all","/ Don't know"],[1,"Just starting","/ Ad hoc"],[2,"Partially","in place"],[3,"Mostly","in place"],[4,"Fully / Advanced","in place"]];

    LIKERT.forEach(function(o){
      var b = document.createElement('div');
      b.className = 'opt';
      b.appendChild(document.createTextNode(o[0] + " · " + o[1]));
      var sm = document.createElement('small');
      sm.textContent = o[2];
      b.appendChild(sm);
      if(answers[idx] === o[0]) b.classList.add('sel');
      b.addEventListener('click', function(){
        answers[idx] = o[0];
        Array.prototype.forEach.call(opts.children, function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
        c.classList.remove('missing');
        updateProgress();
      });
      opts.appendChild(b);
    });

    c.appendChild(opts);
    wrap.appendChild(c);
  });
}

function updateProgress(){
  var done = Object.keys(answers).length;
  var total = items.length;
  var remaining = total - done;
  setText('counter', T[LANG].counter(done, total));
  var pbar = document.getElementById('pbar');
  if(pbar) pbar.style.width = (total ? (done/total*100) : 0) + "%";
  var see = document.getElementById('seeResults');
  if(see) see.disabled = remaining > 0;
  var jump = document.getElementById('btnJump');
  if(jump){
    if(remaining > 0 && done > 0){
      jump.textContent = T[LANG].jumpBtn(remaining);
      jump.classList.remove('hidden');
    }else{
      jump.classList.add('hidden');
    }
  }
}

function jumpToFirstUnanswered(){
  for(var i=0;i<items.length;i++){
    if(answers[i] === undefined){
      var el = document.getElementById('q' + i);
      if(el){
        var prev = document.querySelectorAll('.qcard.missing');
        Array.prototype.forEach.call(prev, function(x){ x.classList.remove('missing'); });
        el.classList.add('missing');
        el.scrollIntoView({ behavior:'smooth', block:'center' });
      }
      return;
    }
  }
}

/* ================= SCORING ================= */
function computeScores(){
  var agg = {};
  PKEYS.forEach(function(k){ agg[k] = { sum:0, n:0 }; });
  items.forEach(function(it, idx){
    var v = answers[idx] || 0;
    agg[it.pkey].sum += v;
    agg[it.pkey].n++;
  });
  var scores = {};
  PKEYS.forEach(function(k){
    var s = agg[k];
    scores[k] = s.n ? Math.round(s.sum / (s.n * 4) * 100) : 0;
  });
  var vals = PKEYS.map(function(k){ return scores[k]; });
  var overall = Math.round(vals.reduce(function(a,b){ return a+b; }, 0) / vals.length);
  return { scores: scores, overall: overall };
}

/* ================= RESULTS ================= */
function submitAndShowResults(){
  var btn = document.getElementById('seeResults');
  if(btn) btn.disabled = true;
  submitAssessmentToSharePoint().then(function(submitted){
    if(btn) btn.disabled = false;
    if(submitted) showResults(false);
  });
}

function printResults(){
  if(radarChart) radarChart.resize();
  setTimeout(function(){ window.print(); }, 120);
}

function showResults(keepScroll){
  hasResults = true;
  var computed = computeScores();
  var scores = computed.scores, overall = computed.overall;
  var t = T[LANG];
  var company = document.getElementById('company').value.trim();

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  setText('resTitle', (company ? company + " — " : "") + t.resTitle);
  setText('resSub', t.resSub(industryLabel(), scopeLabel(), new Date().toLocaleDateString(LANG==='zh' ? 'zh-CN' : 'en-GB')));

  var arc = document.getElementById('gaugeArc');
  var circ = 452;
  if(arc){
    arc.style.stroke = bandColor(overall);
    arc.style.strokeDashoffset = circ - (circ * overall / 100);
  }
  setText('ovNum', overall + "%");

  var si = stageIndex(overall);
  var os = document.getElementById('ovStage');
  if(os){
    os.textContent = STAGES[LANG][si][0];
    os.style.color = bandColor(overall);
  }

  var ld = document.getElementById('ladder');
  if(ld){
    ld.innerHTML = "";
    STAGES[LANG].forEach(function(row, i){
      var n = row[0], a = row[1], b = row[2];
      var act = (i === si);
      var d = document.createElement('div');
      d.className = 'step' + (act ? ' active' : '');
      var left = document.createElement('span');
      left.textContent = n + (act ? t.youAreHere : '');
      var right = document.createElement('span');
      right.textContent = a + "–" + b + "%";
      d.appendChild(left);
      d.appendChild(right);
      ld.appendChild(d);
    });
  }

  var bars = document.getElementById('bars');
  if(bars){
    bars.innerHTML = "";
    PKEYS.forEach(function(k, i){
      var val = scores[k];
      var row = document.createElement('div');
      row.className = 'barrow';
      var name = document.createElement('div');
      name.textContent = pillarLabel(i);
      var track = document.createElement('div');
      track.className = 'bar';
      var fill = document.createElement('div');
      fill.style.width = val + "%";
      fill.style.background = bandColor(val);
      track.appendChild(fill);
      var pct = document.createElement('b');
      pct.textContent = val + "%";
      row.appendChild(name);
      row.appendChild(track);
      row.appendChild(pct);
      bars.appendChild(row);
    });
  }

  var ctx = document.getElementById('radar');
  if(ctx && typeof Chart !== 'undefined'){
    if(radarChart) radarChart.destroy();
    radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: PILLS[LANG],
        datasets: [{
          label: t.radarLabel,
          data: PKEYS.map(function(k){ return scores[k]; }),
          fill: true,
          backgroundColor: 'rgba(20,28,82,.20)',
          borderColor: '#141C52',
          pointBackgroundColor: '#8A704C'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        scales: { r: { min:0, max:100, ticks:{ stepSize:20 } } },
        plugins: { legend: { display:false } }
      }
    });
  }

  var low = PKEYS.slice().sort(function(a,b){ return scores[a] - scores[b]; }).slice(0,3);
  var pr = document.getElementById('priorities');
  if(pr){
    pr.innerHTML = "";
    low.forEach(function(k, i){
      var val = scores[k];
      var pi = PKEYS.indexOf(k);
      var d = document.createElement('div');
      d.className = 'prio';
      var n = document.createElement('div');
      n.className = 'n';
      n.style.background = bandColor(val);
      n.textContent = (i+1);
      var txt = document.createElement('div');
      txt.className = 'txt';
      var b = document.createElement('b');
      b.textContent = pillarLabel(pi) + " — " + val + "% (" + STAGES[LANG][stageIndex(val)][0] + ")";
      var p = document.createElement('p');
      p.textContent = RECS[LANG][k];
      txt.appendChild(b);
      txt.appendChild(p);
      d.appendChild(n);
      d.appendChild(txt);
      pr.appendChild(d);
    });
  }

  var uc = document.getElementById('usecases');
  if(uc){
    uc.innerHTML = "";
    USECASES[LANG][industryKey].forEach(function(x){
      var s = document.createElement('span');
      s.textContent = x;
      uc.appendChild(s);
    });
  }

  if(!keepScroll) window.scrollTo({ top:0, behavior:'smooth' });
}

function restart(){
  hasResults = false;
  document.getElementById('results').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ================= INIT ================= */
function initApp(){
  try{
    applyStaticText();
    rebuildIndustryDropdown();
    rebuildScopeDropdown();
    rebuildReferrerDropdown();

    on('btnEN','click', function(){ setLang('en'); });
    on('btnZH','click', function(){ setLang('zh'); });
    on('btnStart','click', start);
    on('btnBack','click', backToIntro);
    on('btnJump','click', jumpToFirstUnanswered);
    on('seeResults','click', submitAndShowResults);
    on('btnRetake','click', restart);
    on('btnPrint','click', printResults);
  }catch(err){
    showError(err && err.message ? err.message : String(err));
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initApp);
}else{
  initApp();
}

})();
